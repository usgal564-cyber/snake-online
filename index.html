<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <title>Typing Battle Royale</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { background: #323437; color: #d1d0c5; font-family: 'Roboto Mono', monospace; text-align: center; padding: 50px; }
        #lobby, #game-area { max-width: 800px; margin: auto; }
        .text-display { font-size: 24px; line-height: 1.5; margin-bottom: 20px; text-align: left; position: relative; }
        .input-field { width: 100%; background: transparent; border: none; font-size: 24px; color: #e2b714; outline: none; border-bottom: 2px solid #646669; }
        .player-bar { height: 10px; background: #646669; margin: 10px 0; border-radius: 5px; position: relative; }
        .progress { height: 100%; background: #e2b714; transition: 0.2s; border-radius: 5px; }
        .player-info { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 5px; }
        .correct { color: #d1d0c5; }
        .incorrect { color: #ca4754; text-decoration: underline; }
        button { background: #e2b714; color: #323437; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; margin: 10px; }
        input[type="text"] { background: #2c2e31; border: 1px solid #646669; padding: 10px; color: white; border-radius: 5px; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div id="lobby">
        <h1>⌨️ Typing Battle</h1>
        <input type="text" id="username" placeholder="Нэрээ бич"><br>
        <button onclick="createRoom()">ӨРӨӨ ҮҮСГЭХ</button><br>
        <input type="text" id="roomCode" placeholder="КОД ОРУУЛ"><br>
        <button onclick="joinRoom()">ОРОХ</button>
    </div>

    <div id="game-area" style="display:none;">
        <h2 id="room-id" style="color: #646669;"></h2>
        <div id="leaderboard"></div>
        <hr style="border-color: #646669; margin: 30px 0;">
        <div id="text-to-type" class="text-display"></div>
        <input type="text" id="typing-input" class="input-field" autofocus disabled placeholder="Хүлээж байна...">
    </div>

    <script>
        const socket = io();
        let myRoom, myName, targetText = "";
        let startTime;

        function createRoom() {
            myName = document.getElementById('username').value || "User";
            socket.emit('createRoom', { name: myName });
        }

        function joinRoom() {
            myName = document.getElementById('username').value || "User";
            myRoom = document.getElementById('roomCode').value.toUpperCase();
            socket.emit('joinRoom', { name: myName, code: myRoom });
        }

        socket.on('roomCreated', code => { myRoom = code; setupGame(); });
        socket.on('joinedSuccess', data => { myRoom = data.code; targetText = data.text; setupGame(); });

        function setupGame() {
            document.getElementById('lobby').style.display = 'none';
            document.getElementById('game-area').style.display = 'block';
            document.getElementById('room-id').innerText = "ӨРӨӨ: " + myRoom;
            document.getElementById('text-to-type').innerText = targetText || "Бэлэн товчийг дарна уу...";
            socket.emit('playerReady', { code: myRoom, name: myName });
        }

        socket.on('gameStart', () => {
            const input = document.getElementById('typing-input');
            input.disabled = false;
            input.placeholder = "Бичиж эхэл...";
            input.focus();
            startTime = new Date();
        });

        document.getElementById('typing-input').addEventListener('input', e => {
            const val = e.target.value;
            const progress = (val.length / targetText.length) * 100;
            
            // WPM тооцох
            const timeElapsed = (new Date() - startTime) / 60000;
            const wpm = Math.round((val.length / 5) / timeElapsed) || 0;

            // Алдаа шалгах дизайн
            let html = "";
            for(let i=0; i<targetText.length; i++) {
                if(i < val.length) {
                    html += `<span class="${val[i] === targetText[i] ? 'correct' : 'incorrect'}">${targetText[i]}</span>`;
                } else {
                    html += `<span>${targetText[i]}</span>`;
                }
            }
            document.getElementById('text-to-type').innerHTML = html;

            if (val === targetText) {
                socket.emit('updateProgress', { code: myRoom, progress: 100, wpm });
                document.getElementById('typing-input').disabled = true;
            } else {
                socket.emit('updateProgress', { code: myRoom, progress, wpm });
            }
        });

        socket.on('gameState', players => {
            let html = "";
            for(let id in players) {
                const p = players[id];
                html += `
                    <div class="player-info"><span>${p.name}</span><span>${p.wpm} WPM</span></div>
                    <div class="player-bar"><div class="progress" style="width: ${p.progress}%"></div></div>
                `;
            }
            document.getElementById('leaderboard').innerHTML = html;
        });

        socket.on('gameOver', winner => {
            alert("Ялагч: " + winner);
            location.reload();
        });
    </script>
</body>
</html>
